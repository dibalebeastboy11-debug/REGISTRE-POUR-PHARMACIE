<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registre Pharmaciet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71; --primary-dark: #27ae60;
            --danger: #e74c3c; --warning: #f39c12;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-color: #2c3e50; --input-bg: #f9fbfc;
            --table-header: rgba(46, 204, 113, 0.15);
            --total-col: rgba(46, 204, 113, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { overflow: hidden; background-color: #e8f8f5; color: var(--text-color); }

        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; }
        .cursor-glow { position: fixed; width: 300px; height: 300px; background: radial-gradient(circle, rgba(46, 204, 113, 0.15) 0%, transparent 70%); border-radius: 50%; pointer-events: none; z-index: -1; transform: translate(-50%, -50%); }

        .app-container { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 95%; max-width: 1200px; height: 90vh; background: var(--glass-bg); backdrop-filter: blur(15px); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--glass-border); }

        header { padding: 20px; border-bottom: 1px solid var(--glass-border); }
        .header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        
        .pharmacy-name { font-size: 24px; font-weight: 600; border: none; background: none; outline: none; }
        .btn { padding: 10px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
        .btn-reset { background: var(--danger); color: white; }
        .btn-export { background: var(--primary); color: white; }
        
        .nav-tabs { display: flex; gap: 20px; margin-top: 15px; }
        .tab-btn { background: none; border: none; font-size: 16px; font-weight: 600; opacity: 0.6; cursor: pointer; padding-bottom: 5px; }
        .tab-btn.active { opacity: 1; border-bottom: 3px solid var(--primary); color: var(--primary); }

        .page { display: none; padding: 25px; overflow-y: auto; flex: 1; }
        .page.active { display: block; }

        .add-form { display: flex; gap: 10px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ced4da; border-radius: 8px; background: var(--input-bg); flex: 1; }
        
        table { width: 100%; border-collapse: collapse; }
        th { background: var(--table-header); padding: 15px; text-align: left; text-transform: uppercase; font-size: 12px; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-style: italic; }
        td:last-child { font-style: normal; font-weight: 600; background: var(--total-col); }
        
        .btn-sm { padding: 5px 8px; border-radius: 4px; cursor: pointer; border: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .stat-card { background: rgba(255,255,255,0.5); padding: 20px; border-radius: 15px; text-align: center; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="app-container">
        <header>
            <div class="header-top">
                <input type="text" class="pharmacy-name" id="pharmacyName" placeholder="Nom de votre Pharmacie">
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-reset" onclick="resetAll()">🗑️ Réinitialiser</button>
                    <button class="btn btn-export" onclick="exportData()">💾 Exporter JSON</button>
                </div>
            </div>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchPage('registry', this)">📝 Registre</button>
                <button class="tab-btn" onclick="switchPage('stats', this)">📊 Statistiques</button>
            </div>
        </header>

        <div id="page-registry" class="page active">
            <form id="registryForm" class="add-form">
                <input type="hidden" id="editId">
                <input type="text" id="medication" placeholder="Médicament" required>
                <input type="number" id="quantity" placeholder="Qté" required min="1" value="1" style="flex: 0.5;">
                <input type="number" id="price" placeholder="Prix Unitaire" required step="0.01" style="flex: 0.8;">
                <button type="submit" class="btn" style="background: var(--primary); color: white;">Valider</button>
            </form>
            <table>
                <thead><tr><th>Date</th><th>Médicament</th><th>Qté</th><th>Prix U</th><th>Total</th><th>Actions</th></tr></thead>
                <tbody id="registryBody"></tbody>
            </table>
        </div>

        <div id="page-stats" class="page">
            <div class="stats-grid">
                <div class="stat-card"><h3>Aujourd'hui</h3><h2 id="s-day">0</h2></div>
                <div class="stat-card"><h3>Cette Semaine</h3><h2 id="s-week">0</h2></div>
                <div class="stat-card"><h3>Ce Mois</h3><h2 id="s-month">0</h2></div>
                <div class="stat-card"><h3>Global</h3><h2 id="s-total">0</h2></div>
            </div>
        </div>
    </div>

    <script>
        let registryData = JSON.parse(localStorage.getItem('pharmacyRegistryFinal')) || [];

        // --- Logique Formulaire ---
        document.getElementById('registryForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const entry = {
                id: editId ? parseInt(editId) : Date.now(),
                date: editId ? registryData.find(i=>i.id==editId).date : new Date().toLocaleString(),
                medication: document.getElementById('medication').value,
                quantity: parseInt(document.getElementById('quantity').value),
                price: parseFloat(document.getElementById('price').value)
            };

            if(editId) {
                const idx = registryData.findIndex(i => i.id == editId);
                registryData[idx] = entry;
            } else {
                registryData.unshift(entry);
            }
            saveAndRender();
            document.getElementById('registryForm').reset();
            document.getElementById('editId').value = "";
        });

        function renderTable() {
            const body = document.getElementById('registryBody');
            body.innerHTML = '';
            registryData.forEach(item => {
                const total = item.quantity * item.price;
                body.innerHTML += `<tr>
                    <td>${item.date}</td><td>${item.medication}</td><td>${item.quantity}</td>
                    <td>${item.price}</td><td>${total.toLocaleString()}</td>
                    <td>
                        <button class="btn-sm" onclick="editEntry(${item.id})">✏️</button>
                        <button class="btn-sm" onclick="deleteEntry(${item.id})">❌</button>
                    </td>
                </tr>`;
            });
            calculateStats();
        }

        function editEntry(id) {
            const item = registryData.find(i => i.id === id);
            document.getElementById('editId').value = item.id;
            document.getElementById('medication').value = item.medication;
            document.getElementById('quantity').value = item.quantity;
            document.getElementById('price').value = item.price;
        }

        function deleteEntry(id) { if(confirm("Supprimer ?")) { registryData = registryData.filter(i => i.id !== id); saveAndRender(); } }
        function resetAll() { if(confirm("Effacer TOUT le registre ?")) { registryData = []; saveAndRender(); } }
        function saveAndRender() { localStorage.setItem('pharmacyRegistryFinal', JSON.stringify(registryData)); renderTable(); }

        // --- Statistiques ---
        function calculateStats() {
            let d=0, w=0, m=0, t=0; const now = new Date();
            registryData.forEach(i => {
                const val = i.quantity * i.price; t += val;
                if(i.id > Date.now() - 86400000) d += val;
                if(i.id > Date.now() - 604800000) w += val;
                if(new Date(i.id).getMonth() === now.getMonth()) m += val;
            });
            document.getElementById('s-day').innerText = d.toLocaleString();
            document.getElementById('s-week').innerText = w.toLocaleString();
            document.getElementById('s-month').innerText = m.toLocaleString();
            document.getElementById('s-total').innerText = t.toLocaleString();
        }

        // --- Navigation ---
        function switchPage(p, btn) {
            document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('page-'+p).classList.add('active');
            btn.classList.add('active');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(registryData)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'registre.json'; a.click();
        }

        // --- Background 3D ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const geo = new THREE.BoxGeometry(1,1,1);
        const mat = new THREE.MeshStandardMaterial({color: 0x2ecc71});
        const cube = new THREE.Mesh(geo, mat); scene.add(cube);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));
        
        function animate() { requestAnimationFrame(animate); cube.rotation.x += 0.01; cube.rotation.y += 0.01; renderer.render(scene, camera); }
        camera.position.z = 5; animate();

        document.addEventListener('mousemove', e => {
            document.getElementById('cursorGlow').style.left = e.clientX + 'px';
            document.getElementById('cursorGlow').style.top = e.clientY + 'px';
        });

        renderTable();
    </script>
</body>
</html>
